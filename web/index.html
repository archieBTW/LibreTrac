<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LibreTrac — Private, local-first mood, sleep, dream, medication, and cognitive tracking.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- OpenGraph / Social Media -->
  <meta property="og:title" content="LibreTrac — Health & Mood Tracker">
  <meta property="og:description" content="Private, local-first mood, sleep, dream, medication, and cognitive tracking.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="LibreTrac — Health & Mood Tracker">
  <meta name="twitter:description" content="Private, local-first mood, sleep, dream, medication, and cognitive tracking.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- Mobile Web App & Theme Color (Dark Grey / Soft Black #161618) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LibreTrac">
  <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#161618">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>LibreTrac — Mood, Sleep, Dream & Health Tracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #161618;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #161618;
      z-index: 999999;
      transition: opacity 0.35s ease;
      user-select: none;
    }
    .loading-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      animation: pulse 2.2s infinite ease-in-out;
    }
    .loading-title {
      margin-top: 18px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #f4f4f5;
    }
    .loading-spinner {
      margin-top: 20px;
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(255, 255, 255, 0.12);
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Local SQL.js for client-side SQLite extraction -->
  <script src="sql-wasm.js"></script>

  <script>
    // LibreTrac Safe Web Cache & Service Worker Reset
    // Unregisters stale flutter_service_worker.js and clears window.caches (Cache Storage).
    // Note: window.localStorage (SharedPreferences) and IndexedDB (Drift database)
    // are 100% PRESERVED and never touched.
    window.resetLibreTracWebCache = async function() {
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var i = 0; i < regs.length; i++) {
            await regs[i].unregister();
          }
        }
        if ('caches' in window) {
          var keys = await caches.keys();
          for (var j = 0; j < keys.length; j++) {
            await caches.delete(keys[j]);
          }
        }
      } catch (e) {
        console.warn('Error clearing caches:', e);
      }
      window.location.reload(true);
    };

    // LibreTrac Native Web File Download & Share Service
    // 1. Check if Web Share API supports file sharing
    window.canShareFiles = globalThis.canShareFiles = function() {
      try {
        if (!navigator.canShare) return false;
        var testFile = new File(['ping'], 'test.zip', {type: 'application/zip'});
        return navigator.canShare({ files: [testFile] });
      } catch (e) {
        return false;
      }
    };

    // 2. Shares file directly using Web Share API (Primary for Android & iOS)
    window.shareBlobFile = globalThis.shareBlobFile = async function(fileName, base64Data, mimeType, title) {
      try {
        var byteCharacters = atob(base64Data);
        var byteNumbers = new Array(byteCharacters.length);
        for (var i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        var byteArray = new Uint8Array(byteNumbers);
        var blob = new Blob([byteArray], {type: mimeType || 'application/zip'});
        var file = new File([blob], fileName, {type: mimeType || 'application/zip'});

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            files: [file],
            title: title || 'LibreTrac Backup',
            text: 'LibreTrac backup: ' + fileName,
          });
          return true;
        }
        return false;
      } catch (e) {
        if (e.name === 'AbortError') {
          // User closed share dialog without picking an app - not an error
          return true;
        }
        console.warn('Web Share failed, fallback to download:', e);
        return false;
      }
    };

    // 3. Triggers direct browser download via object URL / <a> click
    window.downloadBlobFile = globalThis.downloadBlobFile = function(fileName, base64Data, mimeType) {
      try {
        var byteCharacters = atob(base64Data);
        var byteNumbers = new Array(byteCharacters.length);
        for (var i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        var byteArray = new Uint8Array(byteNumbers);
        var blob = new Blob([byteArray], {type: mimeType || 'application/zip'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();

        // Keep anchor attached briefly so mobile browsers can process the navigation
        setTimeout(function() {
          if (a.parentNode) {
            a.parentNode.removeChild(a);
          }
        }, 10000);

        // Keep object URL alive for 60 seconds
        setTimeout(function() {
          URL.revokeObjectURL(url);
        }, 60000);

        return true;
      } catch (e) {
        console.error('Download error:', e);
        return false;
      }
    };

    // 4. Opens blob in new tab/window as a fallback for mobile browsers
    window.openBlobFile = globalThis.openBlobFile = function(fileName, base64Data, mimeType) {
      try {
        var byteCharacters = atob(base64Data);
        var byteNumbers = new Array(byteCharacters.length);
        for (var i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        var byteArray = new Uint8Array(byteNumbers);
        var blob = new Blob([byteArray], {type: 'application/octet-stream'});
        var url = URL.createObjectURL(blob);
        var win = window.open(url, '_blank');
        setTimeout(function() {
          URL.revokeObjectURL(url);
        }, 60000);
        return !!win;
      } catch (e) {
        console.error('Open blob error:', e);
        return false;
      }
    };

    // 5. LibreTrac In-App Direct Storage Recovery from JSON (indexedDB + localStorage)
    window.restoreFromStorageBackup = globalThis.restoreFromStorageBackup = async function(jsonStr) {
      try {
        var data = (typeof jsonStr === 'string') ? JSON.parse(jsonStr) : jsonStr;
        if (!data) return false;

        // 1. Restore localStorage
        if (data.localStorage) {
          for (var key in data.localStorage) {
            var val = data.localStorage[key];
            var valStr = (typeof val === 'object') ? JSON.stringify(val) : String(val);
            localStorage.setItem(key, valStr);
            if (!key.startsWith('flutter.')) {
              localStorage.setItem('flutter.' + key, valStr);
            } else {
              localStorage.setItem(key.replace(/^flutter\./, ''), valStr);
            }
          }
        }

        // 2. Extract SQLite blocks
        var dbBytes = null;
        if (data.indexedDB) {
          for (var dbName in data.indexedDB) {
            var stores = data.indexedDB[dbName];
            if (!stores) continue;
            var rawBlocks = stores.blocks || stores['blocks'];
            if (!rawBlocks || !Array.isArray(rawBlocks)) continue;

            var chunks = [];
            var totalLen = 0;
            for (var idx = 0; idx < rawBlocks.length; idx++) {
              var b = rawBlocks[idx];
              var val = (b && b.value !== undefined) ? b.value : b;
              if (val && typeof val === 'object' && !(val instanceof Uint8Array)) {
                var keys = Object.keys(val).filter(function(k) { return !isNaN(k); });
                if (keys.length > 0) {
                  keys.sort(function(a, b) { return Number(a) - Number(b); });
                  var arr = new Uint8Array(keys.length);
                  for (var k = 0; k < keys.length; k++) {
                    arr[k] = val[keys[k]];
                  }
                  val = arr;
                }
              }
              if (val instanceof Uint8Array) {
                chunks.push(val);
                totalLen += val.length;
              }
            }
            if (totalLen > 0) {
              dbBytes = new Uint8Array(totalLen);
              var offset = 0;
              for (var c = 0; c < chunks.length; c++) {
                dbBytes.set(chunks[c], offset);
                offset += chunks[c].length;
              }
              break;
            }
          }
        }

        if (dbBytes && dbBytes.length > 0) {
          // Delete existing DB
          await new Promise(function(resolve) {
            var del = window.indexedDB.deleteDatabase('libretrac');
            del.onsuccess = resolve;
            del.onerror = resolve;
            del.onblocked = resolve;
            setTimeout(resolve, 1500);
          });

          // Rebuild at Version 1 with files and blocks
          await new Promise(function(resolve, reject) {
            var req = window.indexedDB.open('libretrac', 1);
            req.onupgradeneeded = function() {
              var db = req.result;
              var f = db.createObjectStore('files', { autoIncrement: true });
              try { f.createIndex('fileName', 'name', { unique: true }); } catch(_) {}
              db.createObjectStore('blocks');
            };
            req.onerror = function() { reject(req.error); };
            req.onsuccess = function() {
              var db = req.result;
              try {
                var tx = db.transaction(['files', 'blocks'], 'readwrite');
                var fStore = tx.objectStore('files');
                var bStore = tx.objectStore('blocks');

                fStore.put({ name: '/database', length: dbBytes.length }, 1);

                var blockSize = 4096;
                var total = Math.ceil(dbBytes.length / blockSize);
                for (var i = 0; i < total; i++) {
                  var off = i * blockSize;
                  var end = Math.min(off + blockSize, dbBytes.length);
                  bStore.put(dbBytes.subarray(off, end), [1, off]);
                }
                tx.oncomplete = function() { db.close(); resolve(); };
                tx.onerror = function(err) { db.close(); reject(err); };
              } catch(e) {
                db.close();
                reject(e);
              }
            };
          });
        }

        return true;
      } catch (err) {
        console.error('restoreFromStorageBackup error:', err);
        return false;
      }
    };

    // 6. Extract SQLite table records from storage backup JSON using SQL.js
    window.extractStorageBackupData = globalThis.extractStorageBackupData = async function(jsonStr) {
      try {
        var data = (typeof jsonStr === 'string') ? JSON.parse(jsonStr) : jsonStr;
        if (!data) return null;

        var out = {};
        if (data.localStorage) {
          out.localStorage = data.localStorage;
          out.prefs = {};
          for (var k in data.localStorage) {
            out.prefs[k.replace(/^flutter\./, '')] = data.localStorage[k];
          }
        }

        // Extract SQLite blocks
        var dbBytes = null;
        if (data.indexedDB) {
          for (var dbName in data.indexedDB) {
            var stores = data.indexedDB[dbName];
            if (!stores) continue;
            var rawBlocks = stores.blocks || stores['blocks'];
            if (!rawBlocks || !Array.isArray(rawBlocks)) continue;

            var chunks = [];
            var totalLen = 0;
            for (var idx = 0; idx < rawBlocks.length; idx++) {
              var b = rawBlocks[idx];
              var val = (b && b.value !== undefined) ? b.value : b;
              if (val && typeof val === 'object' && !(val instanceof Uint8Array)) {
                var keys = Object.keys(val).filter(function(k) { return !isNaN(k); });
                if (keys.length > 0) {
                  keys.sort(function(a, b) { return Number(a) - Number(b); });
                  var arr = new Uint8Array(keys.length);
                  for (var k = 0; k < keys.length; k++) {
                    arr[k] = val[keys[k]];
                  }
                  val = arr;
                }
              }
              if (val instanceof Uint8Array) {
                chunks.push(val);
                totalLen += val.length;
              }
            }
            if (totalLen > 0) {
              dbBytes = new Uint8Array(totalLen);
              var offset = 0;
              for (var c = 0; c < chunks.length; c++) {
                dbBytes.set(chunks[c], offset);
                offset += chunks[c].length;
              }
              break;
            }
          }
        }

        if (dbBytes && typeof initSqlJs === 'function') {
          try {
            var SQL = await initSqlJs({
              locateFile: function(file) { return file; }
            });
            var db = new SQL.Database(dbBytes);
            function queryTable(tbl) {
              try {
                var res = db.exec('SELECT * FROM ' + tbl);
                if (!res || res.length === 0) return [];
                var cols = res[0].columns;
                var vals = res[0].values;
                return vals.map(function(row) {
                  var obj = {};
                  cols.forEach(function(col, i) {
                    var v = row[i];
                    if (typeof v === 'number' && (col.includes('time') || col.includes('date') || col.includes('at')) && v > 0 && v < 10000000000) {
                      v = v * 1000;
                    }
                    var camel = col.replace(/_([a-z])/g, function(g) { return g[1].toUpperCase(); });
                    obj[camel] = v;
                    obj[col] = v;
                  });
                  return obj;
                });
              } catch (_) {
                return [];
              }
            }
            out.substances = queryTable('substances');
            out.moodEntries = queryTable('mood_entries');
            out.sleepEntries = queryTable('sleep_entries');
            out.reactionResults = queryTable('reaction_results');
            out.stroopResults = queryTable('stroop_results');
            out.goNoGoResults = queryTable('go_no_go_results');
            out.digitSpanResults = queryTable('digit_span_results');
            out.symbolSearchResults = queryTable('symbol_search_results');
          } catch (sqlErr) {
            console.warn('SQL.js table query error:', sqlErr);
          }
        }

        return JSON.stringify(out);
      } catch (e) {
        console.error('extractStorageBackupData error:', e);
        return null;
      }
    };

    // 7. Verify and ensure IndexedDB shell is strictly Version 1 with 'files' and 'blocks' stores
    // BEFORE starting Flutter engine to prevent Drift NotFoundError or VersionError.
    window.ensureHealthyDatabase = globalThis.ensureHealthyDatabase = function() {
      return new Promise(function(resolve) {
        if (!('indexedDB' in window)) return resolve();
        try {
          var req = window.indexedDB.open('libretrac');
          req.onerror = function() {
            console.warn('IDB open error, rebuilding shell at Version 1...');
            var del = window.indexedDB.deleteDatabase('libretrac');
            del.onsuccess = del.onerror = del.onblocked = function() {
              var fix = window.indexedDB.open('libretrac', 1);
              fix.onupgradeneeded = function() {
                var fdb = fix.result;
                var fs = fdb.createObjectStore('files', { autoIncrement: true });
                try { fs.createIndex('fileName', 'name', { unique: true }); } catch (_) {}
                fdb.createObjectStore('blocks');
              };
              fix.onsuccess = function() {
                fix.result.close();
                resolve();
              };
              fix.onerror = function() { resolve(); };
            };
          };

          req.onsuccess = function() {
            var db = req.result;
            var hasFiles = db.objectStoreNames.contains('files');
            var hasBlocks = db.objectStoreNames.contains('blocks');
            var ver = db.version;
            db.close();

            if (ver === 1 && hasFiles && hasBlocks) {
              return resolve();
            }

            console.warn('IDB shell unhealthy (ver: ' + ver + ', files: ' + hasFiles + ', blocks: ' + hasBlocks + '), rebuilding...');
            var delReq = window.indexedDB.deleteDatabase('libretrac');
            delReq.onsuccess = delReq.onerror = delReq.onblocked = function() {
              var fixReq = window.indexedDB.open('libretrac', 1);
              fixReq.onupgradeneeded = function() {
                var fdb = fixReq.result;
                var fs = fdb.createObjectStore('files', { autoIncrement: true });
                try { fs.createIndex('fileName', 'name', { unique: true }); } catch (_) {}
                fdb.createObjectStore('blocks');
              };
              fixReq.onsuccess = function() {
                fixReq.result.close();
                resolve();
              };
              fixReq.onerror = function() { resolve(); };
            };
          };
        } catch (e) {
          console.warn('ensureHealthyDatabase exception:', e);
          resolve();
        }
      });
    };

    // Auto-unregister legacy service worker if present so existing users automatically
    // receive the updated app version without being trapped in stale ServiceWorker cache.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }

    // Dismiss loading splash on first frame render
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading-container');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 350);
      }
    });
  </script>
</head>
<body>
  <div id="loading-container">
    <img src="favicon.png" alt="LibreTrac Logo" class="loading-logo" />
    <div class="loading-title">LibreTrac</div>
    <div class="loading-spinner"></div>
  </div>
  <!-- Local SQL.js for client-side SQLite extraction -->
  <script src="sql-wasm.js"></script>

  <script>
    // Ensure database shell is healthy at Version 1 with files and blocks stores
    // BEFORE starting Flutter engine to prevent Drift NotFoundError or VersionError.
    window.ensureHealthyDatabase().then(function() {
      var urlParams = new URLSearchParams(window.location.search);
      var buildTag = urlParams.get('v') || urlParams.get('cb') || Date.now();
      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js?v=' + buildTag;
      s.async = true;
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
